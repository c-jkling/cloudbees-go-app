apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  ci-job:
    steps:
      - uses: docker://alpine/git:latest
        run: |
          git config --global --add safe.directory /cloudbees/workspace
      - name: checkout
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Build Go app
        uses: docker://golang:1.20
        run: |
          go build -v ./...
      - name: Run tests
        uses: docker://golang:1.20
        run: |
          go test -v ./...
      - name: Scan with SonarQube bundled action
        uses: https://github.com/cloudbees-io/sonarqube-bundled-sast-scan-code@v1
      - name: display-prop
        uses: docker://alpine:latest
        run: 'echo "The component property value is: ${{ vars.test }}"'
        kind: test
    needs:
      - test-approval
  test-approval:
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      instructions: Please approve this action
      disallowLaunchByUser: false
      approvers: 1134290c-d263-11ee-acf9-42010a83ae98
      notifyAllEligibleUsers: false
      approvalInputs: |
        favorite-color:
          type: choice
          options:
            - Red
            - Green
            - Blue
          required: true
          description: Please select your favorite color
