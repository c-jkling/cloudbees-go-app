apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: staged-workflow-demo
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"
metadata:
  stages/v1alpha1:
    - name: Stage 1
      jobs:
        - job1
        - reusable-job
jobs:
  job1:
    steps:
      - run: echo "hello world"
        uses: docker://golang:1.20.3-alpine3.17
        name: Hello world
        shell: sh
  reusable-job:
    needs:
      - job1
    uses: ./.cloudbees/workflows/my-workflow.yaml
    vars: inherit
